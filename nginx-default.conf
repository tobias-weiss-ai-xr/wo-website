server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # World-Office demo: DS save callback -> JSON no-op. Nothing persists.
    location = /wo-demo/callback {
        access_log off;
        default_type application/json;
        return 200 '{"error":0}';
    }

    # Predefined demo documents (served to the DS fetcher via public URL)
    location /demo/files/ {
        types { }
        default_type application/vnd.openxmlformats-officedocument.wordprocessingml.document;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
