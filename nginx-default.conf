server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # World-Office demo: DS save callback -> JSON no-op. Nothing persists.
    location = /wo-demo/callback {
        access_log off;
        default_type application/json;
        return 200 '{"error":0}';
    }

    # Predefined demo documents (served to the DS fetcher via public URL)
    location /demo/files/ {
        types { }
        default_type application/vnd.openxmlformats-officedocument.wordprocessingml.document;
    }

    # Side-by-side compare: push the chosen .docx into the World-Office
    # docserver (same-origin upload for the demo page; docserver has no CORS).
    # Scoped to the single upload endpoint, nothing else is forwarded.
    location = /wo-demo/api/upload {
        proxy_pass https://editor.cloud.graphwiz.ai/api/upload;
        proxy_ssl_server_name on;
        proxy_set_header Host editor.cloud.graphwiz.ai;
        proxy_pass_request_body on;
        client_max_body_size 8m;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
